name: Deploy Aira to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Groq API Key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 -c "import os; key=os.environ['GROQ_API_KEY']; f=open('index.html','r',encoding='utf-8'); c=f.read(); f.close(); assert '__GROQ_API_KEY__' in c, 'Placeholder not found!'; c=c.replace('__GROQ_API_KEY__',key); f=open('index.html','w',encoding='utf-8'); f.write(c); f.close(); print('SUCCESS: injected',len(key),'chars, starts with',key[:8])"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
