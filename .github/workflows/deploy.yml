name: Deploy Aira to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Groq API Key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat > /tmp/inject.py << 'PYEOF'
          import os, sys
          key = os.environ.get('GROQ_API_KEY', '').strip()
          if not key:
              sys.exit('ERROR: GROQ_API_KEY secret is empty or not set')
          if '__GROQ_API_KEY__' == key:
              sys.exit('ERROR: secret value is still the placeholder')
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          if '__GROQ_API_KEY__' not in content:
              print('WARNING: placeholder not found - already injected?')
              sys.exit(0)
          content = content.replace('__GROQ_API_KEY__', key)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print('SUCCESS: Key injected -', len(key), 'chars, starts:', key[:8])
          PYEOF
          python3 /tmp/inject.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
