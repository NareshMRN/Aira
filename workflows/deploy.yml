name: Deploy Aria to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Secret Exists
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY secret is not set!"
            exit 1
          fi
          echo "✅ GROQ_API_KEY found (${#GROQ_API_KEY} chars)"

      # Python handles any special characters in the key safely
      - name: Inject Groq API Key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, sys

          key = os.environ.get('GROQ_API_KEY', '')
          if not key:
              print("❌ Key is empty!")
              sys.exit(1)

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          if '__GROQ_API_KEY__' not in content:
              print("❌ Placeholder __GROQ_API_KEY__ not found in index.html!")
              sys.exit(1)

          content = content.replace('__GROQ_API_KEY__', key)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)

          print(f"✅ Key injected successfully ({len(key)} chars)")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
YAML
echo "Done"
